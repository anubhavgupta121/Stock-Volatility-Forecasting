        const oth = st.mode === "nov" ? "vix" : "nov";
        const items = [{ k: "actual", l: "Actual", c: "--ink" }, { k: "GARCH", l: "GARCH(1,1)", c: "--s2" }, { k: "nov", l: "Without VIX", c: "--s1" }, { k: "vix", l: "With VIX", c: "--s1" }];
        dots.selectAll("circle").data(items.filter(i => i.k !== oth)).join("circle").attr("cx", cx).attr("cy", d => y(r[d.k])).attr("r", 3.5).attr("fill", d => css(d.c)).attr("stroke", css("--bg")).attr("stroke-width", 1.5);
        tipV.innerHTML = `<div class="d">${fmtDate(r.date)}</div>` + items.map(i => `<div class="row"${i.k === oth ? ' style="opacity:.6"' : ""}><span>${sw(i.c)}${i.l}</span><b>${pct(r[i.k])}</b></div>`).join("");
        placeTip(tipV, el, cx, W, 6);
      })
      .on("pointerleave", () => { cross.attr("opacity", 0); dots.selectAll("circle").remove(); tipV.hidden = true; });
    cur = { rs, line, mainP, ghost, hline, hlab, y };
    placeTop(false); legend(); table();
  }
  function placeTop(animate) {
    const { rs, y, hline, hlab } = cur, top = d3.max(rs, r => r[st.mode]);
    const t = d3.transition().duration(animate && !reduceMotion ? 650 : 0).ease(d3.easeCubicInOut);
    hline.transition(t).attr("y1", y(top)).attr("y2", y(top));
    hlab.transition(t).attr("y", y(top) - 5);
    hlab.text(`highest forecast ${pct(top)}`);
  }
  function switchMode() {
    const { line, mainP, ghost } = cur, other = st.mode === "nov" ? "vix" : "nov";
    const t = d3.transition().duration(reduceMotion ? 0 : 650).ease(d3.easeCubicInOut);
    mainP.transition(t).attr("d", line(st.mode)); ghost.transition(t).attr("d", line(other));
    placeTop(true); legend(); table();
  }
  function table() {
    const rs = cur.rs, w = WINS[st.win];
    const q = { GARCH: qlike(rs, "GARCH"), nov: qlike(rs, "nov"), vix: qlike(rs, "vix"),
      max: { nov: d3.max(rs, r => r.nov), vix: d3.max(rs, r => r.vix), GARCH: d3.max(rs, r => r.GARCH), actual: d3.max(rs, r => r.actual) } };
    const best = Math.min(q.GARCH, q.nov, q.vix);
    let h = `<thead><tr><th>Model, ${w.lab.replace(/^[^,]*, /, "")}</th><th>QLIKE</th><th>×&nbsp;GARCH</th><th>Peak forecast</th></tr></thead><tbody>`;
    ["GARCH", "nov", "vix"].forEach(k => { const dim = k !== "GARCH" && k !== st.mode;
      h += `<tr class="${q[k] === best ? "best" : ""}${dim ? " off" : ""}"><td>${sw(k === "GARCH" ? "--s2" : "--s1", dim ? ";opacity:.45" : "")}${NAME[k]}${k === st.mode ? " · shown" : ""}</td><td>${f3(q[k])}</td><td>${(q[k] / q.GARCH).toFixed(2)}</td><td>${pct(q.max[k])}</td></tr>`; });
    h += `<tr class="off"><td>Actual</td><td></td><td></td><td>${pct(q.max.actual)}</td></tr></tbody>`;
    document.getElementById("vix-table").innerHTML = h;
    document.getElementById("vix-note").innerHTML = w.note(q);
  }
  render();
  return render;
})();

// ---- Chart-led figures (static explanations; every number is also in the text or a table)
const TX = (g, x, y, txt, o = {}) => g.append("text").attr("x", x).attr("y", y).attr("font-family", "var(--sans)").attr("font-size", o.fs || 12)
  .attr("font-weight", o.fw || 400).attr("font-style", o.it ? "italic" : null).attr("fill", css(o.c || "--ink-2")).attr("text-anchor", o.a || "start")
  .attr("stroke", o.halo === false ? null : css(o.halo || "--panel")).attr("stroke-width", o.halo === false ? null : 3.5).attr("paint-order", "stroke").text(txt);
function fresh(el, H, W) { d3.select(el).select("svg").remove(); return d3.select(el).append("svg").attr("viewBox", `0 0 ${W} ${H}`); }
function arrowDefs(svg, id, color) {
  svg.append("defs").append("marker").attr("id", id).attr("viewBox", "0 0 10 10").attr("refX", 8).attr("refY", 5).attr("markerWidth", 7).attr("markerHeight", 7)
    .attr("orient", "auto-start-reverse").append("path").attr("d", "M0,0 L10,5 L0,10 z").attr("fill", color);
}
const pctAx = v => (v * 100 >= 1 ? d3.format(".0f")(v * 100) : d3.format(".1f")(v * 100)) + "%";

// Figure: this week against next week (volatility clusters)
const clusterEl = document.getElementById("cluster-chart");
const actSeq = heroRows.map(r => r.actual);
const wk = []; for (let i = 0; i + 5 < actSeq.length; i += 5) wk.push({ a: actSeq[i], b: actSeq[i + 5], d: heroRows[i].date });
function drawCluster() {
  const W = Math.max(300, clusterEl.clientWidth), narrow = W < 600, H = narrow ? Math.round(W * 0.95) : 420, m = { t: 14, r: 14, b: 44, l: 52 };
  const svg = fresh(clusterEl, H, W);
  const x = d3.scaleLog().domain([0.0012, 0.1]).range([m.l, W - m.r]), y = d3.scaleLog().domain([0.0012, 0.1]).range([H - m.b, m.t]);
  const tv = [0.002, 0.005, 0.01, 0.02, 0.05];
  svg.append("g").attr("class", "gridline").attr("transform", `translate(${m.l},0)`).call(d3.axisLeft(y).tickValues(tv).tickSize(-(W - m.l - m.r)).tickFormat(""));
  svg.append("g").attr("class", "gridline").attr("transform", `translate(0,${H - m.b})`).call(d3.axisBottom(x).tickValues(tv).tickSize(-(H - m.t - m.b)).tickFormat(""));
  svg.append("g").attr("class", "axis").attr("transform", `translate(0,${H - m.b})`).call(d3.axisBottom(x).tickValues(tv).tickFormat(pctAx).tickSizeOuter(0));
  svg.append("g").attr("class", "axis").attr("transform", `translate(${m.l},0)`).call(d3.axisLeft(y).tickValues(tv).tickFormat(pctAx).tickSizeOuter(0)).call(g => g.select(".domain").remove());
  svg.append("line").attr("x1", x(0.0012)).attr("y1", y(0.0012)).attr("x2", x(0.1)).attr("y2", y(0.1)).attr("stroke", css("--ink-3")).attr("stroke-dasharray", "4 4");
  const col = d3.scaleLog().domain([0.004, 0.012, 0.04]).range([css("--heat1"), css("--heat2"), css("--heat2")]).clamp(true);
  svg.append("g").selectAll("circle").data(wk).join("circle").attr("cx", d => x(d.a)).attr("cy", d => y(d.b)).attr("r", narrow ? 2.6 : 3.4)
    .attr("fill", d => col(d.b)).attr("fill-opacity", 0.78);
  TX(svg, x(0.07), y(0.07) + 16, "next week = this week", { fs: 11.5, c: "--ink-3", a: "end", it: true });
  TX(svg, x(0.0016), y(0.0016) - 34, "calm weeks", { fs: 12.5, fw: 600, c: "--ink" }); TX(svg, x(0.0016), y(0.0016) - 18, "stay calm", { fs: 12.5, c: "--ink-2" });
  const pk = d3.greatest(wk, d => d.b);
  TX(svg, x(pk.a) - 10, y(pk.b) + 4, `COVID: ${pctAx(pk.a)} → ${(pk.b * 100).toFixed(1)}%`, { fs: 12, fw: 600, c: "--ink", a: "end" });
  TX(svg, (m.l + W - m.r) / 2, H - 6, "This week's volatility (typical daily move)", { fs: 12, c: "--ink-2", a: "middle" });
  TX(svg, 0, 0, "Next week's volatility", { fs: 12, c: "--ink-2", a: "middle" }).attr("transform", `translate(13,${(m.t + H - m.b) / 2}) rotate(-90)`);
}

// Figure: features, before and after
const featEl = document.getElementById("feat-chart");
const FEATS = [["high_low_1", "the day's high–low range", 0.497, 0.458, true], ["+ 5-day range", "on top of high_low_1", 0.458, 0.478, false],
  ["vix", "the VIX index", 0.458, 0.400, true], ["+ today's negative return", "on top of vix", 0.400, 0.3985, false], ["+ 5/22-day volatility ratio", "on top of vix", 0.400, 0.399, false]];
function drawFeat() {
  const W = Math.max(300, featEl.clientWidth), narrow = W < 600, lw = narrow ? 0 : 250, rh = narrow ? 62 : 50, m = { t: 26, r: 56, b: 30, l: lw + 10 };
  const H = m.t + FEATS.length * rh + m.b, svg = fresh(featEl, H, W);
  const x = d3.scaleLinear().domain([0.39, 0.505]).range([m.l, W - m.r]);
  svg.append("g").attr("class", "gridline").attr("transform", `translate(0,${H - m.b})`).call(d3.axisBottom(x).ticks(narrow ? 4 : 6).tickSize(-(H - m.t - m.b)).tickFormat(""));
  svg.append("g").attr("class", "axis").attr("transform", `translate(0,${H - m.b})`).call(d3.axisBottom(x).ticks(narrow ? 4 : 6).tickFormat(d3.format(".2f")).tickSizeOuter(0));
  TX(svg, x(0.39), m.t - 12, "← better (lower validation QLIKE)", { fs: 11.5, c: "--ink-3" });
  arrowDefs(svg, "ak", css("--kept")); arrowDefs(svg, "ad", css("--ink-3"));
  FEATS.forEach(([n, d, a, b, kept], i) => {
    const yy = m.t + i * rh + (narrow ? 40 : rh / 2), c = kept ? "--kept" : "--ink-3";
    if (narrow) TX(svg, 0, yy - 20, n, { fs: 13, fw: 600, c: "--ink" });
    else { TX(svg, 0, yy - 3, n, { fs: 13.5, fw: 600, c: "--ink" }); TX(svg, 0, yy + 13, d, { fs: 12, c: "--ink-3" }); }
    svg.append("circle").attr("cx", x(a)).attr("cy", yy).attr("r", 3).attr("fill", css("--ink-3"));
    if (Math.abs(x(b) - x(a)) > 9) svg.append("line").attr("x1", x(a)).attr("x2", x(b)).attr("y1", yy).attr("y2", yy).attr("stroke", css(c)).attr("stroke-width", kept ? 3 : 2).attr("marker-end", `url(#${kept ? "ak" : "ad"})`);
    else svg.append("circle").attr("cx", x(b)).attr("cy", yy).attr("r", 4.5).attr("fill", "none").attr("stroke", css(c)).attr("stroke-width", 2);
    const right = b > a || Math.abs(x(b) - x(a)) <= 9;
    TX(svg, right ? Math.max(x(a), x(b)) + 10 : x(b) - 8, yy + 4, (b === 0.3985 ? "0.3985" : b.toFixed(3)) + (kept ? "  kept" : "  dropped"), { fs: 12.5, fw: kept ? 600 : 400, c: kept ? "--kept" : "--ink-2", a: right ? "start" : "end" });
  });
}

// Figure: the path the project took (validation QLIKE per step)
const pathEl = document.getElementById("path-chart");
const STEPS = [["HAR", "linear regression on past volatility", 0.545, 1], ["Log-HAR", "HAR fitted on logs", 0.561, 0, 0], ["Random forest", "smaller leaves for crash weeks", 0.547, 0, 0],
  ["XGBoost", "boosted depth-1 trees", 0.516, 1], ["XGBoost, QLIKE loss", "same model, trained on the score", 0.497, 1], ["+ the day's range", "high_low_1 added", 0.458, 1],
  ["+ VIX", "the market's own forecast", 0.400, 1], ["GARCH-anchored hybrid", "start from GARCH's forecast", 0.435, 0, 6]];
function drawPath() {
  const W = Math.max(300, pathEl.clientWidth), narrow = W < 600, lw = narrow ? 0 : 250, rh = narrow ? 56 : 44, m = { t: 30, r: 60, b: 30, l: lw + 10 };
  const H = m.t + STEPS.length * rh + m.b, svg = fresh(pathEl, H, W);
  const x = d3.scaleLinear().domain([0.38, 0.575]).range([m.l, W - m.r]);
  const Y = i => m.t + i * rh + (narrow ? 36 : rh / 2);
  svg.append("rect").attr("x", x(0.38)).attr("y", m.t - 8).attr("width", x(0.494) - x(0.38)).attr("height", H - m.b - m.t + 8).attr("fill", css("--good")).attr("fill-opacity", 0.07);
  svg.append("g").attr("class", "axis").attr("transform", `translate(0,${H - m.b})`).call(d3.axisBottom(x).ticks(narrow ? 4 : 7).tickFormat(d3.format(".2f")).tickSizeOuter(0));
  svg.append("line").attr("x1", x(0.494)).attr("x2", x(0.494)).attr("y1", m.t - 8).attr("y2", H - m.b).attr("stroke", css("--s2")).attr("stroke-width", 1.6).attr("stroke-dasharray", "5 4");
  TX(svg, x(0.494) + 6, m.t - 12, "GARCH 0.494", { fs: 12, fw: 600, c: "--s2" });
  TX(svg, x(0.494) - 6, m.t - 12, narrow ? "beats GARCH" : "← beats GARCH", { fs: 12, c: "--ink-2", a: "end" });
  const kept = STEPS.map((s, i) => [s, i]).filter(([s]) => s[3]);
  svg.append("path").attr("d", d3.line()(kept.map(([s, i]) => [x(s[2]), Y(i)]))).attr("fill", "none").attr("stroke", css("--s1")).attr("stroke-width", 2.5);
  STEPS.forEach((s, i) => {
    const [n, d, v, k, from] = s, yy = Y(i), c = k ? "--s1" : "--rej";
    if (!k) svg.append("line").attr("x1", x(STEPS[from][2])).attr("y1", Y(from)).attr("x2", x(v)).attr("y2", yy).attr("stroke", css("--rej")).attr("stroke-width", 1.5).attr("stroke-dasharray", "4 3");
    svg.append("circle").attr("cx", x(v)).attr("cy", yy).attr("r", k ? 6 : 5.5).attr("fill", k ? css("--s1") : css("--panel")).attr("stroke", css(c)).attr("stroke-width", 2);
    TX(svg, i === 6 ? x(v) - 11 : x(v) + 11, yy + 4, v.toFixed(3) + (k ? "" : "  rejected"), { fs: 12.5, fw: k ? 600 : 400, c: k ? "--ink" : "--rej", a: i === 6 ? "end" : "start" });
    if (narrow) TX(svg, 0, yy - 16, n, { fs: 13, fw: k ? 600 : 400, c: k ? "--ink" : "--ink-2" });
    else { TX(svg, 0, yy - 2, n, { fs: 13.5, fw: k ? 600 : 400, c: k ? "--ink" : "--ink-2" }); TX(svg, 0, yy + 13, d, { fs: 12, c: "--ink-3" }); }
  });
}

// Figure: each model wins on its own metric
const campsEl = document.getElementById("camps-chart");
const CAMPS = [["Random forest", 0.00649, 0.547, 0, "start"], ["XGBoost", 0.00661, 0.516, 0, "end"], ["HAR", 0.00669, 0.545, 0, "start"],
  ["XGBoost, QLIKE loss", 0.00687, 0.497, 1, "end"], ["GARCH(1,1)", 0.00690, 0.494, 1, "start"]];
function drawCamps() {
  const W = Math.max(280, campsEl.clientWidth), H = W < 480 ? 280 : 300, m = { t: 16, r: 16, b: 44, l: 50 };
  const svg = fresh(campsEl, H, W);
  const x = d3.scaleLinear().domain([0.00640, 0.00700]).range([m.l, W - m.r]), y = d3.scaleLinear().domain([0.485, 0.56]).range([H - m.b, m.t]);
  svg.append("g").attr("class", "gridline").attr("transform", `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(4).tickSize(-(W - m.l - m.r)).tickFormat(""));
  svg.append("g").attr("class", "axis").attr("transform", `translate(0,${H - m.b})`).call(d3.axisBottom(x).ticks(W < 480 ? 3 : 4).tickFormat(d3.format(".4f")).tickSizeOuter(0));
  svg.append("g").attr("class", "axis").attr("transform", `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(4).tickFormat(d3.format(".2f")).tickSizeOuter(0)).call(g => g.select(".domain").remove());
  arrowDefs(svg, "ac", css("--ink-2"));
  svg.append("path").attr("d", `M${x(0.00661) + 7},${y(0.516) + 4} Q${x(0.00682)},${y(0.514)} ${x(0.00686) - 2},${y(0.497) - 8}`).attr("fill", "none").attr("stroke", css("--ink-2")).attr("stroke-width", 1.3).attr("marker-end", "url(#ac)");
  TX(svg, x(0.00676), y(0.516) - 6, "only the loss changed", { fs: 11.5, c: "--ink-2", a: "middle", it: true, halo: "--panel" });
  CAMPS.forEach(([n, a, b, q, anc]) => {
    svg.append("circle").attr("cx", x(a)).attr("cy", y(b)).attr("r", 6).attr("fill", css(q ? "--s1" : "--s5"));
    TX(svg, x(a) + (anc === "end" ? -10 : 10), y(b) + (n === "GARCH(1,1)" ? 15 : 4), n, { fs: 12.5, fw: 600, c: "--ink", a: anc });
  });
  TX(svg, (m.l + W - m.r) / 2, H - 6, "RMSE, lower is better", { fs: 12, c: "--ink-2", a: "middle" });
  TX(svg, 0, 0, "QLIKE, lower is better", { fs: 12, c: "--ink-2", a: "middle" }).attr("transform", `translate(12,${(m.t + H - m.b) / 2}) rotate(-90)`);
}

// Figure: the QLIKE curve
const qlEl = document.getElementById("qlike-chart");
function drawQlike() {
  const W = Math.max(280, qlEl.clientWidth), H = W < 480 ? 230 : 250, m = { t: 22, r: 14, b: 42, l: 40 };
  const svg = fresh(qlEl, H, W);
  const x = d3.scaleLog().domain([0.25, 4]).range([m.l, W - m.r]), y = d3.scaleLinear().domain([0, 1.7]).range([H - m.b, m.t]);
  const f = r => 1 / r + Math.log(r) - 1;
  svg.append("rect").attr("x", x(0.25)).attr("y", m.t).attr("width", x(1) - x(0.25)).attr("height", H - m.t - m.b).attr("fill", css("--bad")).attr("fill-opacity", 0.06);
  svg.append("g").attr("class", "gridline").attr("transform", `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(4).tickSize(-(W - m.l - m.r)).tickFormat(""));
  svg.append("g").attr("class", "axis").attr("transform", `translate(0,${H - m.b})`).call(d3.axisBottom(x).tickValues([0.25, 0.5, 1, 2, 4]).tickFormat(v => v + "×").tickSizeOuter(0));
  svg.append("g").attr("class", "axis").attr("transform", `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(4).tickSizeOuter(0)).call(g => g.select(".domain").remove());
  const pts = d3.range(0, 201).map(i => 0.25 * Math.pow(16, i / 200));
  svg.append("path").attr("d", d3.line().x(r => x(r)).y(r => y(f(r)))(pts)).attr("fill", "none").attr("stroke", css("--ink")).attr("stroke-width", 2.2);
  TX(svg, x(0.27), m.t + 14, "forecast too low", { fs: 12, fw: 600, c: "--bad" });
  TX(svg, x(3.8), m.t + 14, "forecast too high", { fs: 12, fw: 600, c: "--ink-2", a: "end" });
  [[0.5, "half: 0.307", -7], [2, "double: 0.193", 20]].forEach(([r, t, dy]) => {
    svg.append("circle").attr("cx", x(r)).attr("cy", y(f(r))).attr("r", 5).attr("fill", css(r < 1 ? "--bad" : "--s1"));
    TX(svg, x(r) + 9, y(f(r)) + dy, t, { fs: 12.5, fw: 600, c: "--ink", halo: "--bg" });
  });
  TX(svg, (m.l + W - m.r) / 2, H - 6, "Forecast variance ÷ actual variance", { fs: 12, c: "--ink-2", a: "middle", halo: "--bg" });
}

drawHero(); drawCtx(); drawMain(); drawRangeTable(); drawCluster(); drawFeat(); drawPath(); drawCamps(); drawQlike();
const redraw = () => { drawHero(); drawCtx(); drawMain(); vixDraw(); drawCluster(); drawFeat(); drawPath(); drawCamps(); drawQlike(); };
let rz; new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(redraw, 120); }).observe(mainEl);
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw);
new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

(function () {
  const root = document.documentElement, btn = document.getElementById("theme-btn"), mq = matchMedia("(prefers-color-scheme: dark)");
  const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : mq.matches;
  const label = () => { btn.textContent = isDark() ? "Light mode" : "Dark mode"; btn.setAttribute("aria-label", isDark() ? "Switch to light mode" : "Switch to dark mode"); };
  btn.addEventListener("click", () => { const t = isDark() ? "light" : "dark"; root.dataset.theme = t; try { localStorage.setItem("vol-theme", t); } catch (e) {} label(); });
  mq.addEventListener("change", label);
  new MutationObserver(label).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  label();
})();
</script>
